<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#AEE6FF">
<title>Juega con los Sonidos - Demo</title>
<style>
/* ============================================
   ABECEDARIO INTERACTIVO - ESTILOS
   Educación Parvularia - Diseño infantil
   ============================================ */

/* --- Fuente Century Gothic con alternativas similares --- */
@font-face {
  font-family: 'Century Gothic Fallback';
  src: local('Century Gothic'), local('CenturyGothic');
}

:root {
  color-scheme: light;
  --fuente-principal: 'Century Gothic', 'Century Gothic Fallback', 'Futura', 'Trebuchet MS', 'Verdana', sans-serif;

  /* Paleta infantil */
  --celeste: #5AC8FA;
  --amarillo: #FFD93D;
  --verde: #6BCB77;
  --rosado: #FF8FB1;
  --naranjo: #FFA552;
  --lila: #C89CFA;
  --turquesa: #4DD0C9;

  --fondo-cielo-1: #AEE6FF;
  --fondo-cielo-2: #E8F7FF;

  --texto-oscuro: #3A3A4A;
  --blanco: #FFFFFF;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
  font-family: var(--fuente-principal);
  background: linear-gradient(160deg, var(--fondo-cielo-1) 0%, var(--fondo-cielo-2) 60%, #FFF6E0 100%);
  color: var(--texto-oscuro);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

button {
  font-family: var(--fuente-principal);
  cursor: pointer;
  border: none;
  outline: none;
}

/* ============================================
   FONDO DECORATIVO (nubes, estrellas, confeti)
   ============================================ */
.fondo-decorativo {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}

.nube {
  position: absolute;
  background: rgba(255, 255, 255, 0.85);
  border-radius: 50%;
  filter: blur(1px);
  opacity: 0.9;
  animation: flotarNube 26s ease-in-out infinite;
}
.nube::before, .nube::after {
  content: "";
  position: absolute;
  background: rgba(255, 255, 255, 0.85);
  border-radius: 50%;
}
.nube1 { width: 120px; height: 45px; top: 8%; left: -10%; animation-duration: 32s; }
.nube1::before { width: 60px; height: 60px; top: -30px; left: 15px; }
.nube1::after { width: 70px; height: 50px; top: -18px; left: 55px; }

.nube2 { width: 90px; height: 35px; top: 22%; left: 60%; animation-duration: 40s; animation-delay: -8s; }
.nube2::before { width: 45px; height: 45px; top: -22px; left: 10px; }
.nube2::after { width: 55px; height: 40px; top: -14px; left: 40px; }

.nube3 { width: 100px; height: 38px; top: 65%; left: -15%; animation-duration: 36s; animation-delay: -15s; }
.nube3::before { width: 50px; height: 50px; top: -25px; left: 12px; }
.nube3::after { width: 60px; height: 42px; top: -15px; left: 45px; }

@keyframes flotarNube {
  0% { transform: translateX(0); }
  50% { transform: translateX(60vw); }
  100% { transform: translateX(0); }
}

.estrella {
  position: absolute;
  font-size: 1.6rem;
  opacity: 0.7;
  animation: parpadear 3.2s ease-in-out infinite;
}
.estrella1 { top: 14%; right: 12%; animation-delay: 0s; }
.estrella2 { top: 40%; left: 6%; animation-delay: 1s; font-size: 1.2rem; }
.estrella3 { bottom: 18%; right: 20%; animation-delay: 2s; font-size: 1.3rem; }

@keyframes parpadear {
  0%, 100% { opacity: 0.3; transform: scale(0.9) rotate(0deg); }
  50% { opacity: 0.9; transform: scale(1.15) rotate(15deg); }
}

.forma {
  position: absolute;
  border-radius: 40%;
  opacity: 0.25;
  animation: girarSuave 22s linear infinite;
}
.forma1 { width: 70px; height: 70px; background: var(--rosado); top: 75%; left: 10%; }
.forma2 { width: 50px; height: 50px; background: var(--lila); top: 12%; left: 35%; animation-duration: 18s; }
.forma3 { width: 60px; height: 60px; background: var(--turquesa); bottom: 8%; right: 8%; animation-duration: 26s; }

@keyframes girarSuave {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* ============================================
   BARRA SUPERIOR
   ============================================ */
.barra-superior {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 12px;
  flex-wrap: wrap;
  background: rgba(255, 255, 255, 0.55);
  backdrop-filter: blur(6px);
}

.btn-superior {
  background: var(--blanco);
  color: var(--texto-oscuro);
  font-weight: bold;
  font-size: clamp(0.85rem, 2vw, 1.05rem);
  padding: 10px 18px;
  border-radius: 50px;
  box-shadow: 0 4px 0 rgba(0,0,0,0.12), 0 6px 14px rgba(0,0,0,0.08);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.btn-superior:hover {
  transform: translateY(-2px) scale(1.04);
}

.btn-superior:active {
  transform: translateY(2px) scale(0.97);
  box-shadow: 0 2px 0 rgba(0,0,0,0.12), 0 3px 8px rgba(0,0,0,0.08);
}

/* ============================================
   PANTALLAS GENERALES
   ============================================ */
.pantalla {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  animation: apareceSuave 0.6s ease;
}

.pantalla[hidden] {
  display: none;
}

@keyframes apareceSuave {
  from { opacity: 0; transform: translateY(18px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ============================================
   PANTALLA 1: BIENVENIDA
   ============================================ */
.contenido-bienvenida {
  text-align: center;
  max-width: 700px;
}

.titulo-bienvenida {
  display: flex;
  justify-content: center;
  gap: 18px;
  margin: 0 0 10px 0;
  font-size: clamp(2.5rem, 9vw, 4.5rem);
}

.letra-flotante {
  display: inline-block;
  animation: rebotarLetra 2.4s ease-in-out infinite;
  text-shadow: 3px 3px 0 rgba(0,0,0,0.08);
}
.letra-flotante.l1 { color: var(--rosado); animation-delay: 0s; }
.letra-flotante.l2 { color: var(--amarillo); animation-delay: 0.25s; }
.letra-flotante.l3 { color: var(--celeste); animation-delay: 0.5s; }

@keyframes rebotarLetra {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-16px) rotate(3deg); }
}

.pregunta-bienvenida {
  font-size: clamp(1.2rem, 4vw, 1.9rem);
  font-weight: bold;
  color: var(--texto-oscuro);
  margin: 10px 0 34px 0;
}

.botones-formato {
  display: flex;
  gap: 24px;
  justify-content: center;
  flex-wrap: wrap;
}

.btn-formato {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  width: min(220px, 100%);
  padding: 28px 20px;
  border-radius: 32px;
  font-size: 1.3rem;
  font-weight: bold;
  color: var(--blanco);
  box-shadow: 0 8px 0 rgba(0,0,0,0.15), 0 12px 24px rgba(0,0,0,0.15);
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}

.emoji-boton {
  font-size: 2.4rem;
}

.ejemplo-formato {
  font-size: 1rem;
  font-weight: normal;
  opacity: 0.9;
}

.btn-mayusculas {
  background: linear-gradient(160deg, var(--verde), #4CAF6D);
}

.btn-minusculas {
  background: linear-gradient(160deg, var(--celeste), #3AA6E0);
}

.btn-formato:hover {
  transform: translateY(-6px) scale(1.05);
  box-shadow: 0 10px 0 rgba(0,0,0,0.15), 0 16px 28px rgba(0,0,0,0.18);
}

.btn-formato:active,
.btn-formato.tocando {
  transform: translateY(4px) scale(0.96);
  box-shadow: 0 3px 0 rgba(0,0,0,0.15), 0 6px 14px rgba(0,0,0,0.15);
}

/* ============================================
   PANTALLA 2: ABECEDARIO
   ============================================ */
.pantalla-abecedario {
  flex-direction: column;
  padding-top: 100px;
  align-items: stretch;
}

.titulo-abecedario {
  text-align: center;
  font-size: clamp(1.3rem, 4vw, 2rem);
  color: var(--texto-oscuro);
  margin: 0 0 20px 0;
}

.grid-abecedario {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 18px;
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
  padding-bottom: 40px;
}

/* --- Burbuja de letra --- */
.burbuja-letra {
  position: relative;
  aspect-ratio: 1 / 1;
  width: 100%;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(2.4rem, 7vw, 4.4rem);
  font-weight: bold;
  color: var(--blanco);
  border: 5px solid var(--blanco);
  box-shadow: 0 6px 0 rgba(0,0,0,0.12), 0 10px 18px rgba(0,0,0,0.15);
  animation: rebotarBurbuja 3.6s ease-in-out infinite;
  transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
  text-shadow: 1px 2px 2px rgba(0,0,0,0.15);
  line-height: 1;
  padding: 0 6%;
}

/* Letras dobles: CH necesita compactarse un poco (letras más anchas),
   LL no necesita compresión (son letras angostas; comprimirlas las pega).
   El margen opuesto al letter-spacing evita que el texto se corra del centro. */
.texto-burbuja {
  display: inline-block;
}
.burbuja-letra.par-ch .texto-burbuja {
  letter-spacing: -0.04em;
  margin-right: 0.04em;
}
.burbuja-letra.par-ll .texto-burbuja {
  letter-spacing: 0.02em;
  margin-right: -0.02em;
}

@keyframes rebotarBurbuja {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.burbuja-letra:hover {
  transform: scale(1.1);
  filter: brightness(1.08);
  box-shadow: 0 8px 0 rgba(0,0,0,0.12), 0 14px 22px rgba(0,0,0,0.2);
}

.burbuja-letra:active,
.burbuja-letra.tocando {
  transform: scale(0.94);
}

/* Estado mientras suena el audio: brillo + pulso + agrandado */
.burbuja-letra.hablando {
  animation: pulsoHabla 0.6s ease-in-out infinite;
  filter: brightness(1.25) saturate(1.3);
  box-shadow: 0 0 0 6px rgba(255,255,255,0.55), 0 10px 24px rgba(0,0,0,0.25);
  z-index: 2;
}

@keyframes pulsoHabla {
  0%, 100% { transform: scale(1.12); }
  50% { transform: scale(1.22); }
}

/* Colores variados para las burbujas (se asignan por índice vía nth-child) */
.burbuja-letra:nth-child(7n+1) { background: linear-gradient(160deg, var(--celeste), #3AA6E0); }
.burbuja-letra:nth-child(7n+2) { background: linear-gradient(160deg, var(--amarillo), #F2B705); }
.burbuja-letra:nth-child(7n+3) { background: linear-gradient(160deg, var(--verde), #4CAF6D); }
.burbuja-letra:nth-child(7n+4) { background: linear-gradient(160deg, var(--rosado), #E8608A); }
.burbuja-letra:nth-child(7n+5) { background: linear-gradient(160deg, var(--naranjo), #E8843A); }
.burbuja-letra:nth-child(7n+6) { background: linear-gradient(160deg, var(--lila), #A874E8); }
.burbuja-letra:nth-child(7n+7) { background: linear-gradient(160deg, var(--turquesa), #2FB5AD); }

/* Desfase de la animación de rebote para que no todas boten igual */
.burbuja-letra:nth-child(2n) { animation-delay: 0.4s; }
.burbuja-letra:nth-child(3n) { animation-delay: 0.8s; }
.burbuja-letra:nth-child(5n) { animation-delay: 1.2s; }

/* ============================================
   RESPONSIVE
   Columnas de la grilla del abecedario controladas
   por cantidad fija (sin auto-fit/minmax):
   - PC (> 900px): 6 columnas
   - Tablets (601px - 900px): 5 columnas
   - Celulares (361px - 600px): 4 columnas
   - Celulares muy pequeños (<= 360px): 3 columnas
   ============================================ */

/* Tablets: 600px - 900px -> 5 columnas */
@media (max-width: 900px) {
  .pantalla {
    padding: 20px;
  }
  .grid-abecedario {
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
  }
}

/* Celulares: hasta 600px -> 4 columnas */
@media (max-width: 600px) {
  .pantalla {
    padding: 16px;
  }
  .grid-abecedario {
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .botones-formato {
    flex-direction: column;
    align-items: center;
  }
  .btn-formato {
    width: min(240px, 100%);
    padding: 22px 16px;
  }
  .barra-superior {
    padding: 8px;
    gap: 8px;
  }
  .pantalla-abecedario {
    padding-top: 96px;
  }
}

/* Celulares muy pequeños: hasta 360px -> 3 columnas */
@media (max-width: 360px) {
  .pantalla {
    padding: 12px;
  }
  .grid-abecedario {
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .burbuja-letra {
    border-width: 3px;
    font-size: clamp(1.9rem, 8.5vw, 2.6rem);
  }
  .burbuja-letra.par-ch .texto-burbuja {
    letter-spacing: -0.04em;
    margin-right: 0.04em;
  }
  .burbuja-letra.par-ll .texto-burbuja {
    letter-spacing: 0.02em;
    margin-right: -0.02em;
  }
  .btn-formato {
    width: min(210px, 100%);
    padding: 18px 14px;
  }
  .pantalla-abecedario {
    padding-top: 88px;
  }
}

/* Orientación horizontal con poca altura (celulares acostados) */
@media (orientation: landscape) and (max-height: 500px) {
  .pantalla {
    padding: 14px;
    min-height: auto;
  }
  .pantalla-abecedario {
    padding-top: 70px;
  }
  .titulo-abecedario {
    margin-bottom: 12px;
  }
  .grid-abecedario {
    gap: 10px;
  }
  .titulo-bienvenida {
    font-size: clamp(2rem, 7vw, 3rem);
    margin-bottom: 6px;
  }
  .pregunta-bienvenida {
    margin-bottom: 18px;
  }
  .btn-formato {
    padding: 16px 18px;
  }
}


.pantalla-juego { flex-direction: column; align-items: stretch; padding-top: 90px; }
.zona-palabra { text-align: center; margin-bottom: 28px; }

/* Cuadro de la palabra: mismo lenguaje visual que los botones y burbujas del sitio
   (fondo blanco cálido, borde de color, sombra "de goma") pero como texto continuo. */
#palabraFormada {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 92px;
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
  padding: 18px 28px;
  border-radius: 32px;
  background: linear-gradient(160deg, #FFFFFF, #EFF9FF);
  border: 5px solid var(--celeste);
  box-shadow: 0 8px 0 rgba(0,0,0,0.1), 0 12px 20px rgba(0,0,0,0.12);
  font-weight: bold;
  color: var(--texto-oscuro);
  letter-spacing: 0.1em;
  font-size: 2.6rem;
  white-space: nowrap;
  overflow: hidden;
  transition: font-size 0.15s ease, border-color 0.2s ease;
}
#palabraFormada.vacia {
  font-size: clamp(1.1rem, 3.2vw, 1.5rem) !important;
  font-weight: bold;
  color: rgba(58, 58, 74, 0.4); /* texto traslúcido, sin desvanecer el borde/fondo */
  letter-spacing: normal;
  border-color: rgba(0,0,0,0.12);
  background: rgba(255,255,255,0.6);
  border-style: dashed;
}

.botones-juego { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
.btn-juego {
  padding: 12px 22px; border-radius: 50px; font-weight: bold; font-size: 1rem;
  color: var(--blanco); box-shadow: 0 4px 0 rgba(0,0,0,0.12), 0 6px 14px rgba(0,0,0,0.1);
  transition: opacity 0.15s ease, transform 0.15s ease;
}
.btn-juego:hover { transform: translateY(-2px); }
.btn-juego:disabled { opacity: 0.4; cursor: default; transform: none; }
.btn-voz-real { background: linear-gradient(160deg, var(--verde), #4CAF6D); }
.btn-borrar { background: linear-gradient(160deg, var(--naranjo), #E8843A); }
.btn-reiniciar { background: linear-gradient(160deg, var(--rosado), #E8608A); }

.fila-selector-voz { display: flex; justify-content: center; margin-top: 18px; }
.pildora-selector {
  display: flex; align-items: center; gap: 8px; background: var(--blanco);
  border-radius: 50px; padding: 8px 18px;
  box-shadow: 0 4px 0 rgba(0,0,0,0.1), 0 6px 12px rgba(0,0,0,0.08);
}
.pildora-selector .icono-voz { font-size: 1.1rem; }
#selectorVoz {
  border: none; background: transparent; font-family: var(--fuente-principal);
  font-weight: bold; font-size: 0.85rem; color: var(--texto-oscuro);
  max-width: 240px; cursor: pointer;
}
#selectorVoz:focus { outline: none; }

.titulo-juego { text-align: center; font-size: clamp(1.3rem, 4vw, 2rem); margin-bottom: 8px; }
.subtitulo-juego { text-align: center; font-size: 1rem; opacity: 0.75; margin-bottom: 20px; }

.barra-superior-juego {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: center; padding: 12px;
  background: rgba(255, 255, 255, 0.55); backdrop-filter: blur(6px);
}
</style>
</head>
<body>

  <div class="fondo-decorativo" aria-hidden="true">
    <div class="nube nube1"></div><div class="nube nube2"></div><div class="nube nube3"></div>
    <div class="estrella estrella1">⭐</div><div class="estrella estrella2">✨</div><div class="estrella estrella3">⭐</div>
    <div class="forma forma1"></div><div class="forma forma2"></div><div class="forma forma3"></div>
  </div>

  <main class="pantalla pantalla-juego">
    <header class="barra-superior-juego">
      <a href="index.html" class="btn-superior" style="text-decoration:none; display:inline-block;">🏠 Inicio</a>
    </header>
    <h2 class="titulo-juego">🎮 Juega con los Sonidos</h2>
    <p class="subtitulo-juego">Toca las letras para ir formando una palabra</p>

    <div class="zona-palabra" id="zonaPalabra">
      <div id="palabraFormada"></div>
      <div class="botones-juego">
        <button id="btnVozReal" class="btn-juego btn-voz-real" type="button">🗣️ ¿Cómo suena de verdad?</button>
        <button id="btnBorrar" class="btn-juego btn-borrar" type="button">⌫ Borrar última</button>
        <button id="btnReiniciar" class="btn-juego btn-reiniciar" type="button">🔄 Reiniciar</button>
      </div>
      <div class="fila-selector-voz">
        <div class="pildora-selector">
          <span class="icono-voz">🔊</span>
          <select id="selectorVoz"></select>
        </div>
      </div>
    </div>

    <div id="gridLetras" class="grid-abecedario"></div>

const LETRAS = ["a", "b", "c", "ch", "d", "e", "f", "g", "h", "i", "j", "k", "l", "ll", "m", "n", "ñ", "o", "p", "q", "r", "s", "t", "u", "v", "w", "x", "y", "z"];

const NOMBRES_VOZ_FEMENINA = [
  "mujer", "female", "woman",
  "mónica", "monica", "paulina", "sabina", "helena", "laura", "lucia", "lucía",
  "camila", "elvira", "conchita", "penélope", "penelope", "marisol",
  "esperanza", "soledad", "catalina", "francisca", "reyes", "carmen",
  "ines", "inés", "isabela", "valeria", "renata", "raquel"
];

let vozSeleccionada = null;
const selectorVoz = document.getElementById('selectorVoz');

function poblarSelectorVoces() {
  if (!("speechSynthesis" in window)) return;
  const voces = window.speechSynthesis.getVoices();
  if (!voces || voces.length === 0) return;
  const esVoces = voces.filter(v => v.lang && v.lang.toLowerCase().startsWith("es"));
  const candidatas = esVoces.length ? esVoces : voces;

  selectorVoz.innerHTML = "";
  candidatas.forEach((v, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${v.name} (${v.lang})`;
    selectorVoz.appendChild(opt);
  });

  const guardada = localStorage.getItem('vozElegidaNombre');
  let indiceInicial = candidatas.findIndex(v => v.name === guardada);
  if (indiceInicial < 0) {
    indiceInicial = candidatas.findIndex(v => NOMBRES_VOZ_FEMENINA.some(f => v.name.toLowerCase().includes(f)));
  }
  if (indiceInicial < 0) indiceInicial = 0;

  selectorVoz.value = indiceInicial;
  vozSeleccionada = candidatas[indiceInicial] || null;
  window._vocesDisponibles = candidatas;
}
if ("speechSynthesis" in window) {
  poblarSelectorVoces();
  window.speechSynthesis.onvoiceschanged = poblarSelectorVoces;
}
selectorVoz.addEventListener('change', () => {
  const voces = window._vocesDisponibles || [];
  vozSeleccionada = voces[selectorVoz.value] || null;
  if (vozSeleccionada) localStorage.setItem('vozElegidaNombre', vozSeleccionada.name);
  hablarPalabra('hola');
});
function hablarPalabra(texto) {
  if (!("speechSynthesis" in window) || !texto) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(texto);
  utterance.lang = vozSeleccionada ? vozSeleccionada.lang : "es-ES";
  if (vozSeleccionada) utterance.voice = vozSeleccionada;
  utterance.rate = 0.85;
  utterance.pitch = 1.05;
  utterance.volume = 1; // máximo permitido por el navegador
  window.speechSynthesis.speak(utterance);
}

const AudioContextClass = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioContextClass();
const buffersNombres = {};

function base64ToArrayBuffer(base64) {
  const binaryStr = atob(base64);
  const bytes = new Uint8Array(binaryStr.length);
  for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
  return bytes.buffer;
}
async function precargar(mapaB64, destino) {
  const entradas = Object.entries(mapaB64);
  await Promise.all(entradas.map(async ([clave, b64]) => {
    const arrayBuffer = base64ToArrayBuffer(b64);
    destino[clave] = await audioCtx.decodeAudioData(arrayBuffer);
  }));
}
precargar(NOMBRES_B64, buffersNombres);

function asegurarAudioActivo() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

// La voz grabada suena más fuerte que la voz sintética del navegador (que no se
// puede amplificar más allá de su máximo). Para emparejar ambas, bajamos un poco
// el volumen de la voz grabada al reproducir el nombre de cada letra.
const GANANCIA_VOZ_GRABADA = 0.55;
function reproducirSuelto(buffer) {
  if (!buffer) return;
  const fuente = audioCtx.createBufferSource();
  const ganancia = audioCtx.createGain();
  ganancia.gain.value = GANANCIA_VOZ_GRABADA;
  fuente.buffer = buffer;
  fuente.connect(ganancia);
  ganancia.connect(audioCtx.destination);
  fuente.start();
}

const grid = document.getElementById('gridLetras');
const palabraDisplay = document.getElementById('palabraFormada');
const cajaPalabra = palabraDisplay; // el cuadro y el texto son el mismo elemento
const btnBorrar = document.getElementById('btnBorrar');
const btnReiniciar = document.getElementById('btnReiniciar');
const btnVozReal = document.getElementById('btnVozReal');

const MAX_LETRAS = 12;
let palabra = [];

LETRAS.forEach((l) => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'burbuja-letra';
  if (l === 'ch') btn.classList.add('par-ch');
  if (l === 'll') btn.classList.add('par-ll');
  const span = document.createElement('span');
  span.className = 'texto-burbuja';
  span.textContent = l.toUpperCase();
  btn.appendChild(span);
  btn.addEventListener('click', () => {
    asegurarAudioActivo();
    agregarLetra(l);
  });
  grid.appendChild(btn);
});

function agregarLetra(l) {
  if (palabra.length >= MAX_LETRAS) return;
  palabra.push(l);
  actualizarPalabra();
  reproducirSuelto(buffersNombres[l]);
}

// La palabra se muestra como texto dentro de un cuadro (no burbujas),
// con tamaño de letra dinámico para que quepa siempre en una sola línea.
function actualizarPalabra() {
  if (!palabra.length) {
    palabraDisplay.textContent = '¿Qué palabra vas a formar?';
    palabraDisplay.classList.add('vacia');
  } else {
    palabraDisplay.textContent = palabra.map(l => l.toUpperCase()).join('');
    palabraDisplay.classList.remove('vacia');
    ajustarTamanoTexto();
  }
  btnVozReal.disabled = palabra.length === 0;
}

function ajustarTamanoTexto() {
  const texto = palabraDisplay.textContent;
  const disponible = cajaPalabra.clientWidth - 56; // resta el padding del cuadro
  const ctx = ajustarTamanoTexto._ctx || (ajustarTamanoTexto._ctx = document.createElement('canvas').getContext('2d'));

  let tamano = 56; // tamaño máximo, en px
  const minimo = 20;
  const espaciado = 0.1; // debe calzar con el letter-spacing real del CSS

  while (tamano > minimo) {
    ctx.font = `bold ${tamano}px 'Century Gothic', 'Trebuchet MS', sans-serif`;
    const anchoTexto = ctx.measureText(texto).width;
    const anchoConEspaciado = anchoTexto + tamano * espaciado * (texto.length - 1);
    if (anchoConEspaciado <= disponible) break;
    tamano -= 2;
  }
  palabraDisplay.style.fontSize = tamano + 'px';
}
window.addEventListener('resize', () => { if (palabra.length) ajustarTamanoTexto(); });

actualizarPalabra();

btnBorrar.addEventListener('click', () => {
  palabra.pop();
  actualizarPalabra();
});
btnReiniciar.addEventListener('click', () => {
  palabra = [];
  actualizarPalabra();
  window.speechSynthesis && window.speechSynthesis.cancel();
});
btnVozReal.addEventListener('click', () => {
  if (!palabra.length) return;
  hablarPalabra(palabra.join(''));
});
