<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#AEE6FF">
<title>Abecedario Interactivo - Educación Parvularia</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Fondo decorativo animado: nubes, estrellas y confeti -->
  <div class="fondo-decorativo" aria-hidden="true">
    <div class="nube nube1"></div>
    <div class="nube nube2"></div>
    <div class="nube nube3"></div>
    <div class="estrella estrella1">⭐</div>
    <div class="estrella estrella2">✨</div>
    <div class="estrella estrella3">⭐</div>
    <div class="forma forma1"></div>
    <div class="forma forma2"></div>
    <div class="forma forma3"></div>
  </div>

  <!-- Barra superior fija con botones de Inicio y Repetir instrucciones -->
  <header class="barra-superior" id="barraSuperior" hidden>
    <button id="btnInicio" class="btn-superior" type="button">🏠 Inicio</button>
    <button id="btnInstrucciones" class="btn-superior" type="button">🔊 Repetir instrucciones</button>
  </header>

  <!-- PANTALLA 1: Bienvenida -->
  <main id="pantallaBienvenida" class="pantalla pantalla-bienvenida">
    <div class="contenido-bienvenida">
      <h1 class="titulo-bienvenida">
        <span class="letra-flotante l1">A</span>
        <span class="letra-flotante l2">B</span>
        <span class="letra-flotante l3">C</span>
      </h1>
      <p class="pregunta-bienvenida">¿Qué formato de letra quieres trabajar hoy?</p>
      <div class="botones-formato">
        <button id="btnMayusculas" class="btn-formato btn-mayusculas" type="button">
          <span class="emoji-boton">🟢</span>
          <span>MAYÚSCULAS</span>
          <span class="ejemplo-formato">A B C</span>
        </button>
        <button id="btnMinusculas" class="btn-formato btn-minusculas" type="button">
          <span class="emoji-boton">🔵</span>
          <span>MINÚSCULAS</span>
          <span class="ejemplo-formato">a b c</span>
        </button>
      </div>
    </div>
  </main>

  <!-- PANTALLA 2: Abecedario -->
  <main id="pantallaAbecedario" class="pantalla pantalla-abecedario" hidden>
    <h2 id="tituloAbecedario" class="titulo-abecedario">¡Toca una letra!</h2>
    <div id="gridAbecedario" class="grid-abecedario">
      <!-- Las burbujas de letras se generan dinámicamente con JavaScript -->
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
