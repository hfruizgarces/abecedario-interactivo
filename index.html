<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#AEE6FF">
<title>Recursos Interactivos - Educación Parvularia</title>
<style>
@font-face {
  font-family: 'Century Gothic Fallback';
  src: local('Century Gothic'), local('CenturyGothic');
}

:root {
  color-scheme: light;
  --fuente-principal: 'Century Gothic', 'Century Gothic Fallback', 'Futura', 'Trebuchet MS', 'Verdana', sans-serif;
  --celeste: #5AC8FA;
  --amarillo: #FFD93D;
  --verde: #6BCB77;
  --rosado: #FF8FB1;
  --naranjo: #FFA552;
  --lila: #C89CFA;
  --turquesa: #4DD0C9;
  --fondo-cielo-1: #AEE6FF;
  --fondo-cielo-2: #E8F7FF;
  --texto-oscuro: #3A3A4A;
  --blanco: #FFFFFF;
  --celeste-fuerte: #2F93D6;
  --lila-fuerte: #9856E0;
  --sombra-tinta: 58, 58, 74;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  overflow-x: hidden;
  font-family: var(--fuente-principal);
  background:
    radial-gradient(circle at 12% 18%, rgba(255, 217, 61, 0.22) 0%, transparent 42%),
    radial-gradient(circle at 88% 12%, rgba(255, 143, 177, 0.20) 0%, transparent 42%),
    radial-gradient(circle at 90% 85%, rgba(107, 203, 119, 0.18) 0%, transparent 48%),
    radial-gradient(circle at 8% 85%, rgba(90, 200, 250, 0.18) 0%, transparent 48%),
    linear-gradient(160deg, var(--fondo-cielo-1) 0%, var(--fondo-cielo-2) 55%, #FFF6E0 100%);
  color: var(--texto-oscuro);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.fondo-decorativo { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.fondo-decorativo::before {
  content: ""; position: absolute; inset: -10%;
  background-image: radial-gradient(circle, rgba(58, 58, 74, 0.07) 2.5px, transparent 3px);
  background-size: 30px 30px; opacity: 0.55;
}
.nube { position: absolute; background: rgba(255,255,255,0.85); border-radius: 50%; filter: blur(1px); opacity: 0.9; animation: flotarNube 26s ease-in-out infinite; }
.nube::before, .nube::after { content: ""; position: absolute; background: rgba(255,255,255,0.85); border-radius: 50%; }
.nube1 { width: 110px; height: 42px; top: 10%; left: -10%; animation-duration: 32s; }
.nube1::before { width: 55px; height: 55px; top: -27px; left: 14px; }
.nube1::after { width: 64px; height: 46px; top: -16px; left: 50px; }
.nube2 { width: 86px; height: 32px; top: 24%; left: 60%; animation-duration: 40s; animation-delay: -8s; }
.nube2::before { width: 42px; height: 42px; top: -20px; left: 10px; }
.nube2::after { width: 50px; height: 36px; top: -12px; left: 38px; }
.nube3 { width: 92px; height: 35px; top: 70%; left: -15%; animation-duration: 36s; animation-delay: -15s; }
.nube3::before { width: 46px; height: 46px; top: -22px; left: 11px; }
.nube3::after { width: 54px; height: 38px; top: -13px; left: 40px; }
@keyframes flotarNube { 0% { transform: translateX(0); } 50% { transform: translateX(60vw); } 100% { transform: translateX(0); } }

.estrella { position: absolute; font-size: 1.5rem; opacity: 0.7; animation: parpadear 3.2s ease-in-out infinite; }
.estrella1 { top: 15%; right: 12%; animation-delay: 0s; }
.estrella2 { top: 42%; left: 6%; animation-delay: 1s; font-size: 1.15rem; }
.estrella3 { bottom: 20%; right: 20%; animation-delay: 2s; font-size: 1.25rem; }
@keyframes parpadear { 0%, 100% { opacity: 0.3; transform: scale(0.9) rotate(0deg); } 50% { opacity: 0.9; transform: scale(1.15) rotate(15deg); } }

.forma { position: absolute; border-radius: 38%; opacity: 0.3; animation: girarSuave 22s linear infinite; }
.forma1 { width: 64px; height: 64px; background: var(--rosado); top: 76%; left: 10%; }
.forma2 { width: 46px; height: 46px; background: var(--lila); top: 12%; left: 35%; animation-duration: 18s; }
.forma3 { width: 54px; height: 54px; background: var(--turquesa); bottom: 8%; right: 8%; animation-duration: 26s; }
@keyframes girarSuave { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

.pantalla {
  position: relative; z-index: 1; height: 100vh; width: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 20px; animation: apareceSuave 0.5s ease;
  overflow-y: auto;
}
@keyframes apareceSuave { from { opacity: 0; transform: translateY(14px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

.contenido-bienvenida { text-align: center; max-width: 720px; width: 100%; }

.etiqueta-eyebrow {
  display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.75);
  padding: 6px 18px; border-radius: 50px; font-size: clamp(0.78rem, 2vw, 0.92rem);
  font-weight: bold; letter-spacing: 0.04em; color: var(--texto-oscuro);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 4px 0 rgba(var(--sombra-tinta),0.12), 0 8px 16px rgba(var(--sombra-tinta),0.1);
  margin-bottom: 14px; animation: flotarEyebrow 3.6s ease-in-out infinite;
}
@keyframes flotarEyebrow { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-4px) rotate(1deg); } }

.titulo-bienvenida {
  display: flex; justify-content: center; gap: 14px; margin: 0 0 8px 0;
  font-size: clamp(2.2rem, 8vw, 3.6rem);
}
.letra-flotante { display: inline-block; animation: rebotarLetra 2.4s ease-in-out infinite; }
.letra-flotante.l1 { animation-delay: 0s; }
.letra-flotante.l2 { animation-delay: 0.25s; font-size: 0.7em; opacity: 0.6; }
.letra-flotante.l3 { animation-delay: 0.5s; }
@keyframes rebotarLetra { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-14px) rotate(3deg); } }

.pregunta-bienvenida {
  font-size: clamp(1.1rem, 3.6vw, 1.6rem); font-weight: bold; color: var(--texto-oscuro);
  margin: 6px 0 26px 0;
}

.botones-formato { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }

.btn-formato {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  width: min(230px, 100%); padding: 22px 18px; border-radius: 32px;
  font-size: 1.15rem; font-weight: bold; color: var(--blanco);
  text-decoration: none;
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), 0 8px 0 rgba(var(--sombra-tinta),0.22), 0 14px 22px rgba(var(--sombra-tinta),0.18);
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}
.emoji-boton { font-size: 2.1rem; }
.ejemplo-formato { font-size: 0.9rem; font-weight: normal; opacity: 0.9; }

.btn-lenguaje {
  background: linear-gradient(160deg, var(--celeste), #3AA6E0);
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), 0 8px 0 rgba(47,147,214,0.4), 0 14px 22px rgba(var(--sombra-tinta),0.18);
}
.btn-matematica {
  background: linear-gradient(160deg, var(--lila), #A874E8);
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), 0 8px 0 rgba(152,86,224,0.4), 0 14px 22px rgba(var(--sombra-tinta),0.18);
}
.btn-formato:hover { transform: translateY(-5px) scale(1.04); }
.btn-formato:active { transform: translateY(3px) scale(0.96); }

.pie-pagina {
  margin-top: 30px; text-align: center; font-size: 0.78rem;
  color: var(--texto-oscuro); opacity: 0.55; font-weight: bold;
}

@media (max-width: 560px) {
  .botones-formato { flex-direction: column; align-items: center; }
  .btn-formato { width: min(250px, 100%); }
}
</style>
</head>
<body>

  <div class="fondo-decorativo" aria-hidden="true">
    <div class="nube nube1"></div>
    <div class="nube nube2"></div>
    <div class="nube nube3"></div>
    <div class="estrella estrella1">⭐</div>
    <div class="estrella estrella2">✨</div>
    <div class="estrella estrella3">⭐</div>
    <div class="forma forma1"></div>
    <div class="forma forma2"></div>
    <div class="forma forma3"></div>
  </div>

  <main class="pantalla">
    <div class="contenido-bienvenida">
      <span class="etiqueta-eyebrow">🎈 Aprender jugando</span>
      <h1 class="titulo-bienvenida">
        <span class="letra-flotante l1">🔤</span>
        <span class="letra-flotante l2">✨</span>
        <span class="letra-flotante l3">🔢</span>
      </h1>
      <p class="pregunta-bienvenida">¿Qué quieres aprender hoy?</p>
      <div class="botones-formato">
        <a href="lenguaje.html" class="btn-formato btn-lenguaje">
          <span class="emoji-boton">🔤</span>
          <span>LENGUAJE</span>
          <span class="ejemplo-formato">Letras y Sonidos</span>
        </a>
        <a href="matematicas/index.html" class="btn-formato btn-matematica">
          <span class="emoji-boton">🔢</span>
          <span>MATEMÁTICA</span>
          <span class="ejemplo-formato">Patrones y números</span>
        </a>
      </div>
      <p class="pie-pagina">Educadora Fabiola Basualto — Recursos Interactivos</p>
    </div>
  </main>

</body>
</html>
